<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Booking – LineUp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🧑‍⚕️ Patient Token Booking</h1>

<div class="container">

  <div class="section">
    <h2>Enter Patient Details</h2>

    <label>Name</label>
    <input type="text" id="patientName" placeholder="Enter name">

    <label>Age</label>
    <input type="number" id="patientAge" placeholder="Enter age">

    <label>Phone Number</label>
    <input type="tel" id="patientPhone" placeholder="Enter phone number">

    <button onclick="takeToken()">Take Token</button>

    <div id="patientOutput">
      <p id="patientDetails"></p>
      <p id="patientToken"></p>
      <p id="waitingTime"></p>
      <p id="crowdStatus"></p>
    </div>
  </div>

</div>

<!-- MAIN LOGIC -->
<script src="script.js"></script>

</body>
</html>
